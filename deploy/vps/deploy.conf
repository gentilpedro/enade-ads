# rumo — lido pelo app-deploy e pelo app-backup na VPS (cópia em /opt/rumo/deploy.conf).

# Porta em 127.0.0.1 onde o serviço web atende (a mesma do docker-compose.yml e do nginx.conf).
PORT=5106

# Caminho que responde 2xx com o app pronto. O app aplica as migrations antes de começar a
# atender, então /health só responde com o banco atualizado. Se não responder em ~60 s, o
# app-deploy volta para a versão anterior.
HEALTH_PATH=/health

# Nomes que o deploy pode gravar em secrets.env (separados por espaço). Têm de bater com o passo
# "Enviar os segredos" do workflow. O "__" é o separador de seção do .NET: SMTP__HOST = Smtp:Host.
# Admin__Emails__0 fica em caixa mista: o .NET não diferencia maiúsculas no nome, e assim o nome não parece um
# placeholder de modelo para o preparar_app.sh.
SECRETS="SMTP__HOST SMTP__USERNAME SMTP__PASSWORD SMTP__FROMADDRESS Admin__Emails__0 PRIVACY__CONTROLLERNAME PRIVACY__CONTACTEMAIL"

# Volumes nomeados (sem o prefixo rumo_) que entram no backup diário, além do banco.
BACKUP_VOLUMES="dpkeys"
