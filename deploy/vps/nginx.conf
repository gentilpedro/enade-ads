# rumo — container em 127.0.0.1:5106 (/opt/rumo). Atrás do Cloudflare, com o certificado
# Let's Encrypt "aamora", que lista cada domínio (rumo.aamora.com.br incluído). Cópia em /etc/nginx/conf.d/rumo.conf.
server {
    listen 80;
    listen [::]:80;
    server_name rumo.aamora.com.br;
    # O Let's Encrypt valida o nome por aqui (HTTP-01) antes de o certificado cobrir o rumo.
    include snippets/acme-challenge.conf;
    location / { return 301 https://rumo.aamora.com.br$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rumo.aamora.com.br;
    include snippets/aamora-ssl.conf;

    client_max_body_size 10m;

    # App fora do ar (deploy, reinício, queda): página de manutenção estática, que não depende do app.
    # Sai como 503 porque o Cloudflare troca 502 e 504 da origem pela página de erro dele.
    # Só pega erros do próprio Nginx; um 500 do app continua sendo a página de erro do app.
    error_page 502 504 =503 /manutencao.html;
    location = /manutencao.html {
        internal;
        root /var/www/rumo-manutencao;
        add_header Retry-After 30 always;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:5106;
        proxy_http_version 1.1;
        # WebSocket do Blazor (SignalR) passa direto; sem upgrade fica keep-alive.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        # $remote_addr já é o IP real (CF-Connecting-IP, ver 01-cloudflare-realip.conf).
        # Substitui em vez de acrescentar: um único salto até o app.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Blazor com SignalR: a conexão fica aberta enquanto a página está aberta.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
