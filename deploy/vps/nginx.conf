# rumo — container em 127.0.0.1:5106 (/opt/rumo). Atrás do Cloudflare, com o certificado
# de origem do aamora (*.aamora.com.br). Cópia em /etc/nginx/conf.d/rumo.conf.
server {
    listen 80;
    listen [::]:80;
    server_name rumo.aamora.com.br;
    return 301 https://rumo.aamora.com.br$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rumo.aamora.com.br;
    include snippets/aamora-ssl.conf;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:5106;
        proxy_http_version 1.1;
        # WebSocket do Blazor (SignalR) passa direto; sem upgrade fica keep-alive.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        # $remote_addr já é o IP real (CF-Connecting-IP, ver 01-cloudflare-realip.conf).
        # Substitui em vez de acrescentar: um único salto até o app.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Blazor com SignalR: a conexão fica aberta enquanto a página está aberta.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
