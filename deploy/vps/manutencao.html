<style>
  :root {
    --ink: #14213D;
    --ink-text: #E9EDF5;
    --ink-muted: #AEB8CF;
    --you-on-ink: #FF8A65;
    --ground: #FFFFFF;
    --text: #1A2335;
    --muted: #556075;
    --rule: #D9DEE7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #0A1120;
      --ink-text: #E6EAF2;
      --ink-muted: #A3AEC6;
      --ground: #121A2B;
      --text: #E4E8F0;
      --muted: #9EA9BE;
      --rule: #2A3652;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--ground);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  header {
    background: var(--ink);
    color: var(--ink-text);
    padding: 0.9rem 0;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    max-width: 40rem;
    margin: 0 auto;
    padding: 0 1rem;
    font-weight: 700;
    font-size: 1.15rem;
    letter-spacing: -0.01em;
  }
  .brand img { width: 2rem; height: 2rem; border-radius: 50%; }
  main {
    flex: 1;
    width: 100%;
    max-width: 40rem;
    margin: 0 auto;
    padding: 3.5rem 1rem 2rem;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    margin: 0 0 1rem;
    font-size: 0.85rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
  }
  .status::before {
    content: "";
    width: 0.6rem;
    height: 0.6rem;
    border-radius: 50%;
    background: var(--you-on-ink);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { .status::before { animation: none; } }
  h1 {
    margin: 0 0 1rem;
    font-size: clamp(1.75rem, 5vw, 2.4rem);
    line-height: 1.15;
    letter-spacing: -0.02em;
  }
  p { margin: 0 0 1rem; font-size: 1.05rem; }
  .muted { color: var(--muted); font-size: 0.95rem; }
  footer {
    border-top: 1px solid var(--rule);
    padding: 1rem;
    text-align: center;
    font-size: 0.85rem;
    color: var(--muted);
  }
</style>
</head>
