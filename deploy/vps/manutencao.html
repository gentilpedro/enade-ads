<style>
  :root {
    --ink: #14213D;
    --text: #1A2335;
    --muted: #556075;
    --ochre: #C08A4A;
    --ground: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--ground);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  main {
    width: 100%;
    max-width: 38rem;
    margin: 0 auto;
    padding: 2rem 1rem 1.5rem;
    text-align: center;
  }
  .brand {
    margin: 0 0 1.5rem;
    font-weight: 800;
    font-size: 1.25rem;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    margin: 0 0 0.75rem;
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  .status::before {
    content: "";
    width: 0.55rem;
    height: 0.55rem;
    border-radius: 50%;
    background: var(--ochre);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: 0.3; } }
  @media (prefers-reduced-motion: reduce) { .status::before { animation: none; } }
  h1 {
    margin: 0 0 0.75rem;
    font-size: clamp(1.7rem, 5vw, 2.4rem);
    line-height: 1.15;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  p { margin: 0 0 0.5rem; }
  .muted { color: var(--muted); font-size: 0.92rem; }
  /* A altura manda: o cachorro aparece inteiro sem rolar. Na tela larga as laterais esmaecem no branco;
     na estreita a imagem corta as laterais (object-fit) e o cachorro fica maior. */
  .art {
    display: block;
    height: clamp(14rem, calc(100vh - 20.5rem), 44rem);
    width: auto;
    max-width: 100%;
    margin: auto auto 0;
    object-fit: cover;
    -webkit-mask-image: linear-gradient(to right, transparent, #000 14%, #000 86%, transparent);
    mask-image: linear-gradient(to right, transparent, #000 14%, #000 86%, transparent);
  }
  @media (max-width: 40rem) {
    .art { -webkit-mask-image: none; mask-image: none; }
  }
  footer {
    padding: 0.75rem 1rem 1rem;
    text-align: center;
    font-size: 0.85rem;
    color: var(--muted);
  }
  footer a { color: inherit; }
</style>
</head>
